    <!-- MENÚ DE NAVEGACIÓN INFERIOR (TABS FIJAS) -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#09090b]/90 backdrop-blur-md border-t border-[#18181b] py-3 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button id="tab-planificador" class="flex flex-col items-center gap-1 text-white transition-all">
                <span class="text-lg">📋</span>
                <span class="text-[10px] font-medium tracking-tight">Hábitos</span>
            </button>
            <button id="tab-diario" class="flex flex-col items-center gap-1 text-[#52525b] hover:text-[#a1a1aa] transition-all">
                <span class="text-lg">💡</span>

            </button>
            <button id="tab-contabilidad" class="flex flex-col items-center gap-1 text-[#52525b] hover:text-[#a1a1aa] transition-all">

            </button>
            <button id="tab-personal" class="flex flex-col items-center gap-1 text-[#52525b] hover:text-[#a1a1aa] transition-all">

                <span class="text-[10px] font-medium tracking-tight">Perfil</span>

    <script>
        const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        function obtenerFechaLocal() { 
    return new Date(); 
}

// Reemplazo definitivo para formatear la fecha YYYY-MM-DD usando la hora local exacta
        function obtenerFechaLocalStr(dateObj) {
            const año = dateObj.getFullYear();
            const mes = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dia = String(dateObj.getDate()).padStart(2, '0');
            return `${año}-${mes}-${dia}`;
        }

        const hoyLocal = obtenerFechaLocal();
        let fechaSeleccionadaStr = obtenerFechaLocalStr(hoyLocal); // <-- Corrección de desfase UTC
        let mesVisual = hoyLocal.getMonth();
        let anoVisual = hoyLocal.getFullYear();

        // PERSISTENCIA
        let estructuraFechas = JSON.parse(localStorage.getItem('habitus_v6_fechas')) || {};
        let listaIdeas = JSON.parse(localStorage.getItem('habitus_v6_ideas')) || [];
        let movimientos = JSON.parse(localStorage.getItem('habitus_v6_movimientos')) || [];
        let tagsIdeas = JSON.parse(localStorage.getItem('habitus_v6_tags_ideas')) || [];
        let tagsMovimientos = JSON.parse(localStorage.getItem('habitus_v6_tags_movimientos')) || [];
        let rachaActual = parseInt(localStorage.getItem('habitus_v6_racha')) || 0;
        let ultimoDiaAcceso = localStorage.getItem('habitus_v6_ultimo_acceso') || "";
        let logsNotificacionesEnviadas = JSON.parse(localStorage.getItem('habitus_v6_notifs_logs')) || {};
        const HORA_EN_MS = 60 * 60 * 1000;
        const CLAVE_BACKUP_LOCAL = 'habitus_backup_local_v1';
        const CLAVE_ENDPOINT_NUBE = 'habitus_cloud_endpoint';
        const GITHUB_REPOSITORIO = 'BlackSandev37/Habitus';
        const GITHUB_ARCHIVO_BACKUP = 'habitus-backup.json';
        const CLAVE_TOKEN_GITHUB = 'habitus_github_token';
        let revisionNotificacionesEnCurso = false;
        let envioNotificacionEnCurso = false;
        let tokenGithubActivo = localStorage.getItem(CLAVE_TOKEN_GITHUB) || '';
        let sincronizacionGithubEnCurso = false;
        let sincronizacionGithubPendiente = false;

        function obtenerEstadoCompleto() {
            return {
                version: 1,
                actualizadoEn: new Date().toISOString(),
                estructuraFechas,
                listaIdeas,
                movimientos,
                tagsIdeas,
                tagsMovimientos,
                rachaActual,
                ultimoDiaAcceso,
                logsNotificacionesEnviadas
            };
        }

        function guardarBackupLocal() {
            localStorage.setItem(CLAVE_BACKUP_LOCAL, JSON.stringify(obtenerEstadoCompleto()));
        }

        function restaurarBackupLocalSiHaceFalta() {
            const tieneDatosActuales = Object.keys(estructuraFechas).length > 0 || listaIdeas.length > 0 || movimientos.length > 0;
            if (tieneDatosActuales) return;

            try {
                const backup = JSON.parse(localStorage.getItem(CLAVE_BACKUP_LOCAL));
                if (!backup || backup.version !== 1) return;
                estructuraFechas = backup.estructuraFechas || {};
                listaIdeas = backup.listaIdeas || [];
                movimientos = backup.movimientos || [];
                tagsIdeas = backup.tagsIdeas || [];
                tagsMovimientos = backup.tagsMovimientos || [];
                rachaActual = Number(backup.rachaActual) || 0;
                ultimoDiaAcceso = backup.ultimoDiaAcceso || '';
                logsNotificacionesEnviadas = backup.logsNotificacionesEnviadas || {};
            } catch (error) {
                console.warn('No se pudo leer el backup local de Habitus.', error);
            }
        }

        function sincronizarBackupNube() {
            const endpoint = localStorage.getItem(CLAVE_ENDPOINT_NUBE);
            if (!endpoint) return;
            fetch(endpoint, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(obtenerEstadoCompleto())
            }).catch(() => {});
        }

        function persistirEstado() {
            guardarBackupLocal();
            sincronizarBackupNube();
            sincronizarGithubAutomaticamente();
        }

        function codificarBase64(texto) {
            const bytes = new TextEncoder().encode(texto);
            let binario = '';
            bytes.forEach(byte => binario += String.fromCharCode(byte));
            return btoa(binario);
        }

        function decodificarBase64(contenido) {
            const binario = atob(contenido.replace(/\n/g, ''));
            const bytes = Uint8Array.from(binario, caracter => caracter.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function actualizarEstadoBackupGithub(texto) {
            estadoBackupGithub.textContent = texto;
        }

        async function obtenerBackupGithub(token) {
            const respuesta = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORIO}/contents/${GITHUB_ARCHIVO_BACKUP}?ref=main`, {
                headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}` }
            });
            if (respuesta.status === 404) return null;
            if (!respuesta.ok) throw new Error(`GitHub respondió ${respuesta.status}`);
            return respuesta.json();
        }

        async function subirBackupGithub() {
            const token = tokenGithub.value.trim();
            if (!token) {
                actualizarEstadoBackupGithub('Falta el token');
                return;
            }

            actualizarEstadoBackupGithub('Subiendo...');
            try {
                persistirEstado();
                const archivoActual = await obtenerBackupGithub(token);
                const contenido = JSON.stringify(obtenerEstadoCompleto(), null, 2);
                const respuesta = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORIO}/contents/${GITHUB_ARCHIVO_BACKUP}`, {
                    method: 'PUT',
                    headers: {
                        Accept: 'application/vnd.github+json',
                        Authorization: `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Actualizar backup de Habitus',
                        content: codificarBase64(contenido),
                        branch: 'main',
                        ...(archivoActual ? { sha: archivoActual.sha } : {})
                    })
                });
                if (!respuesta.ok) throw new Error(`GitHub respondió ${respuesta.status}`);
                tokenGithubActivo = token;
                if (recordarTokenGithub.checked) localStorage.setItem(CLAVE_TOKEN_GITHUB, token);
                else localStorage.removeItem(CLAVE_TOKEN_GITHUB);
                actualizarEstadoBackupGithub(`Guardado ${new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' })}`);
            } catch (error) {
                actualizarEstadoBackupGithub('No se pudo guardar');
                console.warn('No se pudo subir el backup a GitHub.', error);
            }
        }

        async function sincronizarGithubAutomaticamente() {
            if (!tokenGithubActivo) return;
            if (sincronizacionGithubEnCurso) {
                sincronizacionGithubPendiente = true;
                return;
            }

            sincronizacionGithubEnCurso = true;
            try {
                const archivoActual = await obtenerBackupGithub(tokenGithubActivo);
                const respuesta = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORIO}/contents/${GITHUB_ARCHIVO_BACKUP}`, {
                    method: 'PUT',
                    headers: {
                        Accept: 'application/vnd.github+json',
                        Authorization: `Bearer ${tokenGithubActivo}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Backup automático de Habitus',
                        content: codificarBase64(JSON.stringify(obtenerEstadoCompleto(), null, 2)),
                        branch: 'main',
                        ...(archivoActual ? { sha: archivoActual.sha } : {})
                    })
                });
                if (!respuesta.ok) throw new Error(`GitHub respondió ${respuesta.status}`);
                actualizarEstadoBackupGithub(`Auto backup ${new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' })}`);
            } catch (error) {
                actualizarEstadoBackupGithub('Auto backup pendiente');
                console.warn('No se pudo realizar el backup automático en GitHub.', error);
            } finally {
                sincronizacionGithubEnCurso = false;
                if (sincronizacionGithubPendiente) {
                    sincronizacionGithubPendiente = false;
                    sincronizarGithubAutomaticamente();
                }
            }
        }

        function fusionarLista(local, remoto) {
            const registros = new Map(remoto.map(registro => [String(registro.id), registro]));
            local.forEach(registro => registros.set(String(registro.id), registro));
            return [...registros.values()];
        }

        async function restaurarBackupGithub() {
            const token = tokenGithub.value.trim();
            if (!token) {
                actualizarEstadoBackupGithub('Falta el token');
                return;
            }

            actualizarEstadoBackupGithub('Consultando...');
            try {
                const archivo = await obtenerBackupGithub(token);
                if (!archivo) {
                    actualizarEstadoBackupGithub('No existe backup');
                    return;
                }
                tokenGithubActivo = token;
                if (recordarTokenGithub.checked) localStorage.setItem(CLAVE_TOKEN_GITHUB, token);
                else localStorage.removeItem(CLAVE_TOKEN_GITHUB);
                const remoto = JSON.parse(decodificarBase64(archivo.content));
                if (remoto.version !== 1) throw new Error('Versión de backup no compatible');

                const fechasRemotas = remoto.estructuraFechas || {};
                const fechasLocales = estructuraFechas;
                estructuraFechas = { ...fechasRemotas, ...fechasLocales };

        function prepararTareasRecurrentes(fecha) {
            const fuentes = Object.entries(estructuraFechas).flatMap(([fechaOrigen, tareas]) =>
                tareas.filter(tarea => tarea.recurrente && !tarea.omitida && tarea.fechaInicio && tarea.fechaInicio === fechaOrigen)
                    .map(tarea => ({ ...tarea, fechaOrigen }))
            );
            if (!fuentes.length) return;
            if (!estructuraFechas[fecha]) estructuraFechas[fecha] = [];
            fuentes.forEach(fuente => {
                if (fecha < fuente.fechaOrigen || estructuraFechas[fecha].some(tarea => tarea.origenId === fuente.origenId)) return;
                estructuraFechas[fecha].push({
                    ...fuente,
                    id: `${fuente.origenId}_${fecha}`,
                    completada: false
                });
            });
            estructuraFechas[fecha].sort((a, b) => (a.hora || '23:59').localeCompare(b.hora || '23:59'));
            localStorage.setItem('habitus_v6_fechas', JSON.stringify(estructuraFechas));
            persistirEstado();

        // Revisa las reglas una vez por hora y tolera que la pestaña haya estado suspendida.
        async function evaluarAlertasProgramadas(ahora) {
            if (revisionNotificacionesEnCurso) return;
            revisionNotificacionesEnCurso = true;

            const hoyStr = obtenerFechaLocalStr(ahora);
            const tareasHoy = estructuraFechas[hoyStr] || [];
            const pendientes = tareasHoy.filter(t => !t.completada && t.hora);

            if (pendientes.length === 0) {
                revisionNotificacionesEnCurso = false;
                return;
            }

            const horaActualMs = ahora.getTime();
            try {
                for (const tarea of pendientes) {
                    const [h, m] = tarea.hora.split(':');
                    const fechaTarea = new Date(ahora);
                    fechaTarea.setHours(Number(h), Number(m), 0, 0);
                    const tiempoTareaMs = fechaTarea.getTime();
                    const puntosDeControl = [
                        { clave: 'en_punto', offset: 0, msg: `Momento de actuar: ${tarea.texto}` },
                        { clave: '30_min', offset: 30 * 60 * 1000, msg: `En 30 minutos: ${tarea.texto}` },
                        { clave: '60_min', offset: HORA_EN_MS, msg: `En 1 hora aproximada: ${tarea.texto}` }
                    ];

                    for (const punto of puntosDeControl) {
                        const tiempoTargetMs = tiempoTareaMs - punto.offset;
                        const idAlertaUnico = `${tarea.id}_${punto.clave}_${hoyStr}`;
                        const alertaVigente = horaActualMs >= tiempoTargetMs && horaActualMs - tiempoTargetMs < HORA_EN_MS;
                        if (!alertaVigente || logsNotificacionesEnviadas[idAlertaUnico]) continue;

                        const tareasCercanas = pendientes.filter(otra => {
                            if (otra.id === tarea.id) return false;
                            const [oh, om] = otra.hora.split(':');
                            const fOtra = new Date(ahora);
                            fOtra.setHours(Number(oh), Number(om), 0, 0);
                            return Math.abs(fOtra.getTime() - tiempoTareaMs) <= HORA_EN_MS;
                        });
                        const bloqueCompleto = [tarea, ...tareasCercanas].sort((a, b) => a.hora.localeCompare(b.hora));
                        const esPrimeraDelBloque = bloqueCompleto[0].id === tarea.id;
                        if (!esPrimeraDelBloque) continue;

                        const cuerpo = tareasCercanas.length > 0
                            ? `Bloque de rutinas aproximándose:\n${bloqueCompleto.map(t => `• ${t.texto} (${t.hora})`).join('\n')}`
                            : punto.msg;
                        const enviada = await triggerNotificacion(
                            tareasCercanas.length > 0 ? 'Bloque Concentrado 🪐' : 'Habitus Alerta ⏱️',
                            cuerpo
                        );
                        if (enviada) {
                            bloqueCompleto.forEach(t => {
                                logsNotificacionesEnviadas[`${t.id}_${punto.clave}_${hoyStr}`] = true;
                            });
                            localStorage.setItem('habitus_v6_notifs_logs', JSON.stringify(logsNotificacionesEnviadas));
                            return;
                        }
                    }
                }
            } finally {
                revisionNotificacionesEnCurso = false;
            }
        }

        function escaparHtml(valor) {
            return String(valor).replace(/[&<>'"]/g, caracter => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[caracter]));
        }

        function crearTagBadge(tag) {
            if (!tag) return '';
            const colores = [
                ['#172554', '#60a5fa'], ['#3f1d2e', '#fb7185'], ['#12352b', '#34d399'],
                ['#422006', '#fbbf24'], ['#312e81', '#a5b4fc'], ['#164e63', '#67e8f9']
            ];
            const indice = [...tag].reduce((total, caracter) => total + caracter.charCodeAt(0), 0) % colores.length;
            const [fondo, texto] = colores[indice];
            return `<span class="inline-flex max-w-full truncate rounded-md border px-2 py-1 text-[10px] font-bold uppercase tracking-wide" style="background:${fondo};color:${texto};border-color:${texto}66">${escaparHtml(tag)}</span>`;
        }

        function estaEnRango(fecha, desde, hasta) {
            return (!desde || !fecha || fecha >= desde) && (!hasta || !fecha || fecha <= hasta);
        }

        function crearTag(input, tags, clave) {
            const nombre = input.value.trim().replace(/\s+/g, ' ');
            if (!nombre || tags.some(tag => tag.toLowerCase() === nombre.toLowerCase())) return;
            tags.push(nombre);
            tags.sort((a, b) => a.localeCompare(b, 'es'));
            localStorage.setItem(clave, JSON.stringify(tags));
            persistirEstado();
            input.value = '';
            actualizarOpcionesTags();
            const tipo = clave === 'habitus_v6_tags_ideas' ? 'idea' : 'movimiento financiero';
            triggerNotificacion('Etiqueta creada', `Nueva etiqueta de ${tipo}: ${nombre}`, { tag: 'habitus-evento', permitirReemplazo: true });
        }

        function renderGestorTags(gestor, tags, tipo) {
            gestor.innerHTML = tags.length > 0 ? tags.map((tag, indice) => `
                <div class="flex items-center gap-2 min-w-0">
                    <div class="min-w-0 flex-1">${crearTagBadge(tag)}</div>
                    <button onclick="editarTag('${tipo}', ${indice})" class="shrink-0 text-xs text-zinc-500 hover:text-white px-2 py-1" aria-label="Editar tag" title="Editar tag">✎</button>
                    <button onclick="eliminarTag('${tipo}', ${indice})" class="shrink-0 text-xs text-zinc-500 hover:text-red-400 px-2 py-1" aria-label="Eliminar tag" title="Eliminar tag">✕</button>
                </div>
            `).join('') : '<p class="text-[10px] text-[#52525b] px-1">No hay tags creadas.</p>';
        }

        function obtenerDatosTag(tipo) {
            return tipo === 'idea'
                ? { tags: tagsIdeas, clave: 'habitus_v6_tags_ideas', registros: listaIdeas }
                : { tags: tagsMovimientos, clave: 'habitus_v6_tags_movimientos', registros: movimientos };
        }

        window.editarTag = function(tipo, indice) {
            const datos = obtenerDatosTag(tipo);
            const anterior = datos.tags[indice];
            const nuevo = prompt('Nuevo nombre de la tag:', anterior);
            const nombre = nuevo ? nuevo.trim().replace(/\s+/g, ' ') : '';
            if (!nombre || nombre.toLowerCase() === anterior.toLowerCase()) return;
            if (datos.tags.some((tag, tagIndice) => tagIndice !== indice && tag.toLowerCase() === nombre.toLowerCase())) return;
            datos.tags[indice] = nombre;
            datos.registros.forEach(registro => {
                if (registro.tag === anterior) registro.tag = nombre;
            });
            localStorage.setItem(datos.clave, JSON.stringify(datos.tags));
            localStorage.setItem(tipo === 'idea' ? 'habitus_v6_ideas' : 'habitus_v6_movimientos', JSON.stringify(datos.registros));
            persistirEstado();
            actualizarOpcionesTags();
            renderIdeas();
            renderMovimientos();
        };

        window.eliminarTag = function(tipo, indice) {
            const datos = obtenerDatosTag(tipo);
            const nombre = datos.tags[indice];
            if (!confirm(`¿Eliminar la tag "${nombre}"? Los elementos conservarán su contenido, pero quedarán sin tag.`)) return;
            datos.tags.splice(indice, 1);
            datos.registros.forEach(registro => {
                if (registro.tag === nombre) registro.tag = '';
            });
            localStorage.setItem(datos.clave, JSON.stringify(datos.tags));
            localStorage.setItem(tipo === 'idea' ? 'habitus_v6_ideas' : 'habitus_v6_movimientos', JSON.stringify(datos.registros));
            persistirEstado();
            actualizarOpcionesTags();
            renderIdeas();
            renderMovimientos();
        };

        function llenarSelectorTags(selector, tags, etiquetaInicial) {
            const valorActual = selector.value;
            selector.innerHTML = `<option value="">${etiquetaInicial}</option>`;
            tags.forEach(tag => {
                const opcion = document.createElement('option');
                opcion.value = tag;
                opcion.textContent = tag;
                selector.appendChild(opcion);
            });
            selector.value = tags.includes(valorActual) ? valorActual : '';
        }

        function actualizarOpcionesTags() {
            llenarSelectorTags(selectorTagIdea, tagsIdeas, 'Sin tag');
            llenarSelectorTags(filtroTagIdea, tagsIdeas, 'Todas las tags');
            llenarSelectorTags(selectorTagMovimiento, tagsMovimientos, 'Sin tag');
            llenarSelectorTags(filtroTagMovimiento, tagsMovimientos, 'Todas las tags');
            renderGestorTags(gestorTagsIdea, tagsIdeas, 'idea');
            renderGestorTags(gestorTagsMovimiento, tagsMovimientos, 'movimiento');
        }

        btnAgregarTagIdea.onclick = () => crearTag(inputNuevaTagIdea, tagsIdeas, 'habitus_v6_tags_ideas');
        btnAgregarTagMovimiento.onclick = () => crearTag(inputNuevaTagMovimiento, tagsMovimientos, 'habitus_v6_tags_movimientos');
        btnGestionarTagsIdea.onclick = () => gestorTagsIdea.classList.toggle('hidden');
        btnGestionarTagsMovimiento.onclick = () => gestorTagsMovimiento.classList.toggle('hidden');

        function agregarMovimiento() {
            const monto = Number(inputMonto.value);
            const concepto = inputConcepto.value.trim();
            if (!Number.isFinite(monto) || monto <= 0 || !concepto) return;

            const movimiento = {
                id: Date.now(),
                monto: Math.round(monto * 100) / 100,
                tipo: selectorTipoMovimiento.value,
                concepto,
                tag: selectorTagMovimiento.value,
                fecha: obtenerFechaLocalStr(obtenerFechaLocal())
            };
            movimientos.unshift(movimiento);
            localStorage.setItem('habitus_v6_movimientos', JSON.stringify(movimientos));
            persistirEstado();
            inputMonto.value = '';
            inputConcepto.value = '';
            selectorTagMovimiento.value = '';
            renderMovimientos();
            triggerNotificacion(
                movimiento.tipo === 'ingreso' ? 'Ingreso registrado' : 'Gasto registrado',
                `${concepto}: $${movimiento.monto.toFixed(2)}`,
                { tag: 'habitus-evento', permitirReemplazo: true }
            );
        }

        window.eliminarMovimiento = function(id) {
            movimientos = movimientos.filter(movimiento => movimiento.id !== id);
            localStorage.setItem('habitus_v6_movimientos', JSON.stringify(movimientos));
            persistirEstado();
            renderMovimientos();
        };

        function renderMovimientos() {
            const tipo = filtroTipoMovimiento.value;
            const tag = filtroTagMovimiento.value;
            const desde = filtroDesdeMovimiento.value;
            const hasta = filtroHastaMovimiento.value;
            const visibles = movimientos.filter(movimiento =>
                (!tipo || movimiento.tipo === tipo) && (!tag || movimiento.tag === tag) && estaEnRango(movimiento.fecha, desde, hasta)
            );
            const balance = visibles.reduce((total, movimiento) =>
                total + (movimiento.tipo === 'ingreso' ? movimiento.monto : -movimiento.monto), 0
            );
            balanceContabilidad.textContent = `${balance < 0 ? '-' : ''}$${Math.abs(balance).toFixed(2)}`;
            balanceContabilidad.className = `text-sm font-bold ${balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
            movimientosContainer.innerHTML = visibles.length > 0 ? visibles.map(movimiento => `
                <div class="bg-[#09090b] p-3 rounded-xl border border-[#18181b] flex justify-between items-center gap-3">
                    <div class="min-w-0">
                        ${movimiento.tag ? `<div class="mb-2">${crearTagBadge(movimiento.tag)}</div>` : ''}
                        <p class="text-sm text-zinc-200 truncate">${escaparHtml(movimiento.concepto)}</p>
                        <p class="text-[10px] text-[#52525b] font-mono">${escaparHtml(movimiento.fecha)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold whitespace-nowrap ${movimiento.tipo === 'ingreso' ? 'text-emerald-400' : 'text-rose-400'}">${movimiento.tipo === 'ingreso' ? '+' : '-'}$${movimiento.monto.toFixed(2)}</span>
                        <button onclick="eliminarMovimiento(${movimiento.id})" class="text-xs text-zinc-600 hover:text-red-400 transition-colors" aria-label="Eliminar movimiento">✕</button>
                    </div>
                </div>
            `).join('') : '<p class="text-center text-xs text-[#52525b] py-4">No hay movimientos con estos filtros.</p>';
        }

        btnAgregarMovimiento.onclick = agregarMovimiento;
        filtroTipoMovimiento.onchange = renderMovimientos;
        filtroTagMovimiento.onchange = renderMovimientos;
        filtroDesdeMovimiento.onchange = renderMovimientos;
        filtroHastaMovimiento.onchange = renderMovimientos;

        async function triggerNotificacion(titulo, cuerpo, opciones = {}) {
            const { tag = 'habitus-widget', permitirReemplazo = false } = opciones;
            if (envioNotificacionEnCurso || !('serviceWorker' in navigator) || Notification.permission !== 'granted') return false;

            envioNotificacionEnCurso = true;
            try {
                const reg = await navigator.serviceWorker.ready;
                if (!permitirReemplazo) {
                    const notificacionesActivas = await reg.getNotifications({ tag });
                    if (notificacionesActivas.length > 0) return false;
                }

                await reg.showNotification(titulo, {
                    body: cuerpo,
                    tag,
                    renotify: permitirReemplazo,
                    silent: true,
                    requireInteraction: true
                });
                return true;
            } finally {
                envioNotificacionEnCurso = false;
            }
        }

        // TABS NAVEGACIÓN Y DIARIO
        function switchTab(activeTab, showView) {
            [tabPlanificador, tabDiario, tabContabilidad, tabPersonal].forEach(tab => {
                tab.classList.toggle('text-white', tab === activeTab);
                tab.classList.toggle('text-[#52525b]', tab !== activeTab);
            });
            [viewPlanificador, viewDiario, viewContabilidad, viewPersonal].forEach(view => {
                view.classList.toggle('hidden', view !== showView);
            });
        }

        tabPlanificador.onclick = () => switchTab(tabPlanificador, viewPlanificador);
        tabDiario.onclick = () => {
                        switchTab(tabDiario, viewDiario);
            renderIdeas();
        };
        tabContabilidad.onclick = () => {
            switchTab(tabContabilidad, viewContabilidad);
            renderMovimientos();
        };
        tabPersonal.onclick = () => switchTab(tabPersonal, viewPersonal);

        btnGuardarIdea.onclick = () => {
            const texto = inputNuevaIdea.value.trim();
            if (texto) {
                listaIdeas.unshift({
                    id: Date.now(),
                    texto: texto,
                    tag: selectorTagIdea.value,
                    fechaDia: obtenerFechaLocalStr(obtenerFechaLocal()),
                    fecha: obtenerFechaLocal().toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' })
                });
                localStorage.setItem('habitus_v6_ideas', JSON.stringify(listaIdeas));
                persistirEstado();
                inputNuevaIdea.value = "";
                selectorTagIdea.value = "";
                renderIdeas();
                triggerNotificacion('Idea guardada', texto, { tag: 'habitus-evento', permitirReemplazo: true });
            }
        };

        window.eliminarIdea = function(id) {
            listaIdeas = listaIdeas.filter(idea => idea.id !== id);
            localStorage.setItem('habitus_v6_ideas', JSON.stringify(listaIdeas));
            persistirEstado();
            renderIdeas();
        };

        function renderIdeas() {
            ideasContainer.innerHTML = "";
            const tagFiltrada = filtroTagIdea.value;
            const desde = filtroDesdeIdea.value;
            const hasta = filtroHastaIdea.value;
            listaIdeas.filter(idea =>
                (!tagFiltrada || idea.tag === tagFiltrada) && estaEnRango(idea.fechaDia, desde, hasta)
            ).forEach(idea => {
                const card = document.createElement('div');
                card.className = "bg-[#09090b] p-4 rounded-xl border border-[#18181b] space-y-2 relative";
                card.innerHTML = `
                    ${idea.tag ? `<div class="mb-2">${crearTagBadge(idea.tag)}</div>` : ''}
                    <p class="text-sm text-zinc-200 leading-relaxed">${escaparHtml(idea.texto)}</p>
                    <div class="flex justify-between items-center pt-1">
                        <span class="text-[10px] text-[#52525b] font-mono">${escaparHtml(idea.fecha)}</span>
                        <button onclick="eliminarIdea(${idea.id})" class="text-xs text-zinc-600 hover:text-red-400 transition-colors">Eliminar</button>
                    </div>
                `;
                ideasContainer.appendChild(card);
            });
        }

        filtroTagIdea.onchange = renderIdeas;
        filtroDesdeIdea.onchange = renderIdeas;
        filtroHastaIdea.onchange = renderIdeas;

        btnSubirGithub.onclick = subirBackupGithub;
        btnBajarGithub.onclick = restaurarBackupGithub;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(() => {
                    if (Notification.permission === 'default') return Notification.requestPermission();
                }).then(() => {
                    iniciarControlNotificaciones();
                });
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) evaluarAlertasProgramadas(obtenerFechaLocal());
        });

        // RUN
        evaluarCambioDeDia();
        actualizarOpcionesTags();
        renderCalendario();
        renderTareas();
        renderIdeas();
        renderMovimientos();
        procesarTiempoReal();
        if (tokenGithubActivo) restaurarBackupGithub();
    </script>
</body>
</html>
